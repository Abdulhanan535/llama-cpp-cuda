name: Build llama.cpp CUDA (Auto Release)

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA architecture (75, 86, 89 or auto)'
        required: false
        default: 'auto'
      enable_nccl:
        description: 'Enable NCCL'
        required: false
        default: 'true'
        type: boolean

  push:
    branches: [ main ]

env:
  REPO_DIR: llama.cpp
  BUILD_DIR: llama.cpp/build
  STAGE_DIR: llama_stage
  TARGETS: llama-cli llama-server llama-gguf-hash

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 🔥 FIX: remove broken duplicate CUDA repos
      - name: Clean CUDA repos
        run: |
          sudo rm -f /etc/apt/sources.list.d/cuda*.list || true
          sudo rm -f /etc/apt/sources.list.d/*nvidia*.list || true

      # ✅ Install CUDA (stable)
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          method: 'network'
          # ❌ NO sub-packages (this caused your error)

      # ✅ Ensure CUDA works
      - name: Setup CUDA env
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          nvcc --version

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            build-essential \
            libcurl4-openssl-dev \
            git \
            wget

      - name: Install NCCL
        if: ${{ inputs.enable_nccl == 'true' }}
        run: sudo apt-get install -y libnccl-dev || true

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/PrismML-Eng/llama.cpp "$REPO_DIR"
          cd "$REPO_DIR"
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ✅ Stable arch handling
      - name: Set CUDA arch
        run: |
          if [ "${{ inputs.cuda_arch }}" = "auto" ] || [ -z "${{ inputs.cuda_arch }}" ]; then
            echo "CUDA_ARCH_NUM=75;80;86;89" >> $GITHUB_ENV
            echo "CUDA_ARCH=multi" >> $GITHUB_ENV
          else
            echo "CUDA_ARCH_NUM=${{ inputs.cuda_arch }}" >> $GITHUB_ENV
            echo "CUDA_ARCH=sm_${{ inputs.cuda_arch }}" >> $GITHUB_ENV
          fi

      # ✅ Clean CMake (no broken flags)
      - name: Configure
        run: |
          mkdir -p "$BUILD_DIR"

          NCCL_FLAG="-DGGML_NCCL=OFF"
          if [ "${{ inputs.enable_nccl }}" = "true" ] && ldconfig -p | grep -q nccl; then
            NCCL_FLAG="-DGGML_NCCL=ON"
          fi

          cmake -S "$REPO_DIR" -B "$BUILD_DIR" \
            -DGGML_CUDA=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCH_NUM}" \
            -DLLAMA_CURL=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            $NCCL_FLAG

      - name: Build
        run: |
          cmake --build "$BUILD_DIR" \
            -j$(nproc) \
            --target $TARGETS

      - name: Stage binaries
        run: |
          mkdir -p "$STAGE_DIR"

          for t in $TARGETS; do
            for p in "$BUILD_DIR/bin/$t" "$BUILD_DIR/$t"; do
              if [ -f "$p" ]; then
                cp "$p" "$STAGE_DIR/"
                echo "Added $t"
                break
              fi
            done
          done

          cat > "$STAGE_DIR/BUILD_INFO.txt" << EOF
          Commit: $GIT_HASH
          CUDA Arch: $CUDA_ARCH
          Date: $(date -u)
          EOF

      - name: Package
        run: |
          TARBALL="llamacpp-cuda-${GIT_HASH}.tar.gz"
          tar -czf "$TARBALL" -C "$STAGE_DIR" .
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llamacpp-cuda
          path: ${{ env.TARBALL }}

      # 🚀 Install GitHub CLI
      - name: Install gh
        run: sudo apt-get install -y gh

      # 🚀 Auto rolling release (like Koboldcpp)
      - name: Push to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create rolling \
            --title "Rolling Release" \
            --notes "Latest auto-built CUDA binaries" \
            || echo "Release exists"

          gh release upload rolling "$TARBALL" --clobber
